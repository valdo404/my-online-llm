[project]
name = "ai-treasure-hunt"
version = "0.1.0"
description = "A cooperative treasure hunt game between two AI agents - each must save their kitten"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.2.0",
    "pydantic>=2.0",
    "asyncio-extras>=1.3; python_version<'3.12'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
treasure-hunt = "treasure_hunt.main:main"
